<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B5E20">
<title>בוקר של אלופים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pitch:#2E7D32;--pitch-light:#43A047;--gold:#FFB300;--gold-dark:#E65100;
  --bg:#F1F8E9;--card:#fff;--text:#212121;--text2:#616161;--text3:#9E9E9E;
  --shadow:0 2px 12px rgba(0,0,0,.12);--radius:16px;
  --legendary1:#E65100;--legendary2:#FFB300;
  --epic1:#7B1FA2;--epic2:#CE93D8;
  --rare1:#1565C0;--rare2:#42A5F5;
  --common1:#2E7D32;--common2:#66BB6A;
}
.evening-mode{
  --pitch:#1565C0;--pitch-light:#1E88E5;--bg:#E3F2FD;
}
.evening-mode .header{background:linear-gradient(135deg,#0D47A1,#1565C0)}
.evening-mode .progress-fill,.evening-mode .col-progress-fill{background:linear-gradient(90deg,#1565C0,#42A5F5)}
.evening-mode .session-btn.active{background:#1565C0;border-color:#1565C0}
.evening-mode .session-btn{border-color:#1565C0;color:#1565C0}
.evening-mode .nav-tab.active{color:#1565C0}
.evening-mode .col-header{border-bottom-color:#BBDEFB}
.evening-mode .task-item.done{background:#E3F2FD}
.evening-mode .col-task.done{background:#E3F2FD}
.evening-mode .task-item.done .task-check{background:#1565C0;border-color:#1565C0}
.evening-mode .col-task.done .col-task-check{color:#1565C0}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
#app{height:100%;display:flex;flex-direction:column;max-width:500px;margin:0 auto;overflow:hidden}
.header{
  background:linear-gradient(135deg,#1B5E20,#2E7D32);
  padding:10px 16px 8px;display:flex;align-items:center;justify-content:center;gap:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:10;flex-shrink:0;
}
.kid-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;transition:.25s;flex-shrink:0;
}
.kid-btn .kid-avatar{
  width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  background:#455A64;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;overflow:hidden;transition:.25s;
}
.kid-btn.active .kid-avatar{
  width:60px;height:60px;border:3px solid var(--gold);
  box-shadow:0 0 14px rgba(255,179,0,.5);font-size:18px;
}
.kid-btn .kid-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.kid-btn .kid-label{
  font-size:10px;color:rgba(255,255,255,.5);font-weight:600;transition:.2s;
}
.kid-btn.active .kid-label{font-size:13px;color:#fff}
.kid-btn .photo-badge{
  position:absolute;bottom:0;right:0;width:16px;height:16px;
  background:var(--gold);border-radius:50%;font-size:8px;
  display:none;align-items:center;justify-content:center;
  border:2px solid #1B5E20;
}
.kid-btn.active .photo-badge{display:flex}
.kid-btn .kid-avatar-wrap{position:relative}
.greeting{
  text-align:center;padding:14px 16px 6px;font-size:20px;font-weight:700;color:var(--pitch);
}
.day-label{text-align:center;font-size:13px;color:var(--text2);padding-bottom:8px}
.reset-btn{font-size:18px;color:var(--text2);cursor:pointer;margin-right:6px;opacity:.7;transition:.2s;padding:4px 8px}
.reset-btn:active{opacity:1;transform:scale(1.2)}
.progress-wrap{padding:0 20px 10px}
.progress-bar{
  height:28px;background:#E0E0E0;border-radius:14px;position:relative;overflow:visible;
  display:flex;align-items:center;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--pitch),var(--pitch-light));
  border-radius:14px;transition:width .4s ease;min-width:0;
}
.progress-text{
  position:absolute;width:100%;text-align:center;font-size:12px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2;direction:ltr;
}
.milestones{display:flex;justify-content:space-between;padding:4px 4px 0;direction:ltr}
.milestone{font-size:14px;opacity:.4;transition:.3s}
.milestone.reached{opacity:1;transform:scale(1.3)}
.milestone.next{animation:pulse 1.5s infinite}
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.task-list{padding:0 14px}
.task-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;margin:6px 0;
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  cursor:pointer;transition:all .3s;position:relative;overflow:hidden;
}
.task-item:active{transform:scale(.97)}
.task-item.done{background:#E8F5E9}
.task-item.done .task-name{text-decoration:line-through;color:var(--text3)}
.task-item.special{border:2px solid var(--gold);background:#FFF8E1}
.task-item.special.done{background:#F1F8E9;border-color:var(--pitch-light)}
.task-icon{font-size:28px;flex-shrink:0;width:36px;text-align:center}
.task-name{font-size:17px;font-weight:600;flex:1}
.task-special-badge{
  font-size:10px;background:var(--gold);color:#fff;padding:2px 6px;
  border-radius:8px;font-weight:700;position:absolute;top:6px;left:6px;
}
.task-check{
  width:32px;height:32px;border-radius:50%;border:3px solid #BDBDBD;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:.3s;font-size:18px;
}
.task-item.done .task-check{background:var(--pitch);border-color:var(--pitch);color:#fff}
.task-item.bonus{border:2px dashed var(--gold)}
.task-item.bonus .task-name::after{content:' ⭐';font-size:12px}
.task-item.legendary{border:2px dashed #7B1FA2;background:linear-gradient(135deg,#F3E5F5,#fff)}
.task-item.legendary .task-name::after{content:' 👑';font-size:12px}
.col-task.legendary{border:2px dashed #7B1FA2;background:linear-gradient(135deg,#F3E5F5,#fff)}
.swap-btn{
  display:block;margin:10px auto;padding:10px 24px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#E65100,#FFB300);color:#fff;font-size:16px;
  font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(230,81,0,.3);
}
.swap-hint{text-align:center;font-size:13px;color:var(--text2);margin-top:6px}
.swap-notify{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;
}
.swap-notify-box{
  background:#fff;border-radius:20px;padding:32px 28px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);animation:pop .4s ease;max-width:320px;
}
.swap-notify-icon{font-size:56px;margin-bottom:12px}
.swap-notify-title{font-size:22px;font-weight:800;color:var(--pitch);margin-bottom:8px}
.swap-notify-sub{font-size:15px;color:var(--text2);margin-bottom:20px}
.swap-notify-btn{
  padding:12px 32px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#E65100,#FFB300);color:#fff;font-size:17px;
  font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(230,81,0,.3);
}
.slot.swappable{cursor:pointer}
.slot.swappable .slot-filled{animation:pulse 1.2s infinite}
.bench-slot{cursor:pointer;transition:.2s;border-radius:10px;padding:4px}
.bench-slot:active{transform:scale(.93)}
.bench-slot.bench-selected{background:rgba(255,180,0,.35);box-shadow:0 0 0 2px var(--gold);animation:pulse 1.2s infinite}
.bench-swap-target{cursor:pointer}
.bench-swap-target .slot-filled,.bench-swap-target .slot-empty{box-shadow:0 0 12px 3px rgba(255,180,0,.5);border-radius:50%}

.team-preview{padding:12px 14px}
.team-preview-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px;text-align:center}
.pitch{
  position:relative;width:100%;padding-top:120%;background:var(--pitch);
  border-radius:var(--radius);overflow:hidden;direction:ltr;
  box-shadow:inset 0 0 30px rgba(0,0,0,.15);
}
.pitch-lines{position:absolute;inset:0}
.pitch-lines::before{
  content:'';position:absolute;top:50%;left:8%;right:8%;height:2px;
  background:rgba(255,255,255,.25);
}
.pitch-lines::after{
  content:'';position:absolute;top:50%;left:50%;width:18%;padding-top:18%;
  transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.25);border-radius:50%;
}
.pitch-center-dot{
  position:absolute;top:50%;left:50%;width:6px;height:6px;
  background:rgba(255,255,255,.3);border-radius:50%;transform:translate(-50%,-50%);
}
.pitch-box-top{
  position:absolute;top:0;left:25%;right:25%;height:18%;
  border:2px solid rgba(255,255,255,.2);border-top:none;border-radius:0 0 4px 4px;
}
.pitch-box-bottom{
  position:absolute;bottom:0;left:25%;right:25%;height:18%;
  border:2px solid rgba(255,255,255,.2);border-bottom:none;border-radius:4px 4px 0 0;
}
.pitch-goal-top{
  position:absolute;top:0;left:38%;right:38%;height:7%;
  border:2px solid rgba(255,255,255,.15);border-top:none;
}
.pitch-goal-bottom{
  position:absolute;bottom:0;left:38%;right:38%;height:7%;
  border:2px solid rgba(255,255,255,.15);border-bottom:none;
}
.slot{
  position:absolute;transform:translate(-50%,-50%);text-align:center;
  width:54px;transition:.3s;
}
.slot-empty{
  width:40px;height:40px;border:2px dashed rgba(255,255,255,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin:0 auto 2px;
}
.slot-empty-label{font-size:8px;color:rgba(255,255,255,.5);font-weight:600}
.slot-label{font-size:9px;color:rgba(255,255,255,.6);font-weight:600;margin-top:1px}
.slot-filled{
  width:50px;text-align:center;margin:0 auto 2px;
}
.slot-photo{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:block;margin:0 auto;
}
.slot-photo-placeholder{
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;margin:0 auto;
  font-size:16px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4);
}
.slot-filled .slot-name{font-size:9px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.slot.pop{animation:popIn .4s ease}
.slot.just-drafted{animation:draftGlow 1.5s ease infinite}
.slot.just-drafted .slot-photo,.slot.just-drafted .slot-photo-placeholder{box-shadow:0 0 16px 4px var(--gold)}
@keyframes draftGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.bottom-nav{
  display:flex;background:#fff;border-top:1px solid #E0E0E0;flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-tab{
  flex:1;padding:10px;text-align:center;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text3);transition:.2s;
}
.nav-tab.active{color:var(--pitch)}
.nav-tab-icon{font-size:22px;display:block;margin-bottom:2px}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  animation:fadeIn .3s;backdrop-filter:blur(4px);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.draft-title{color:#fff;font-size:24px;font-weight:800;margin-bottom:24px;text-align:center}
.draft-subtitle{color:rgba(255,255,255,.7);font-size:14px;margin-top:-16px;margin-bottom:20px}
.draft-cards{display:flex;gap:10px;direction:ltr;padding:0 12px}
.draft-card{
  width:110px;height:160px;perspective:1000px;cursor:pointer;flex-shrink:0;
}
.draft-card-inner{
  width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;position:relative;
}
.draft-card.flipped .draft-card-inner{transform:rotateY(180deg)}
.draft-card.not-picked{opacity:0;transform:scale(.8);transition:.4s}
.draft-card-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:14px;overflow:hidden;
}
.card-back{
  background:linear-gradient(135deg,#0D47A1,#1A237E);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:40px;position:relative;overflow:hidden;gap:4px;
}
.card-back-1{background:linear-gradient(135deg,#AD1457,#6A1B9A)}
.card-back-2{background:linear-gradient(135deg,#E65100,#F57F17)}
.card-back::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(transparent 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.08) 55%,transparent 100%);
  animation:shine 2.5s infinite;transform:rotate(25deg);
}
@keyframes shine{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
.card-front{transform:rotateY(180deg)}

.player-card{
  width:100%;height:100%;border-radius:14px;padding:8px 6px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.3);position:relative;
}
.player-card.rarity-3{background:linear-gradient(135deg,var(--legendary1),var(--legendary2))}
.player-card.rarity-2{background:linear-gradient(135deg,var(--epic1),var(--epic2))}
.player-card.rarity-1{background:linear-gradient(135deg,var(--rare1),var(--rare2))}
.player-card.rarity-0{background:linear-gradient(135deg,var(--common1),var(--common2))}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;width:100%;font-weight:700;margin-bottom:2px}
.pc-left{display:flex;flex-direction:column;align-items:center;min-width:28px}
.pc-rating{font-size:22px;font-weight:900;line-height:1;color:#FFD600}
.pc-pos{font-size:8px;opacity:.85;margin-top:1px;font-weight:700}
.pc-country{font-size:13px;margin-top:1px;line-height:1}
.pc-right{display:flex;flex-direction:column;align-items:center;min-width:28px}
.pc-stars{font-size:9px;line-height:1}
.pc-photo{
  width:62px;height:62px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.pc-photo-placeholder{
  width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;border:3px solid rgba(255,255,255,.4);
}
.pc-name{font-size:12px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.pc-team{font-size:9px;opacity:.7;display:flex;align-items:center;gap:3px;margin-top:1px}
.pc-team-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pc-stats-row{display:flex;gap:3px;margin-top:auto;justify-content:center;padding-top:3px}
.pc-stat{font-size:7px;font-weight:700;text-align:center;padding:2px 5px;border-radius:4px;color:#fff;line-height:1.1}
.pc-stat span{display:block;font-size:13px;font-weight:900}
.pc-stat-atk{background:#D32F2F}
.pc-stat-def{background:#1565C0}
.pc-stat-ovr{background:#E6A200}
.bench-row{display:flex;justify-content:center;gap:12px;padding:10px 14px;background:rgba(0,0,0,.15);border-radius:0 0 16px 16px;margin:-8px 14px 0}
.bench-slot{text-align:center;flex:0 0 60px}
.bench-slot .slot-label{font-size:10px;color:rgba(255,255,255,.7)}

/* Weekend Challenge Card Battle */
.wc-view{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);position:relative}
.wc-scoreboard{background:linear-gradient(135deg,#0D47A1,#1565C0);padding:14px 16px;text-align:center;color:#fff;flex-shrink:0}
.wc-score-row{display:flex;justify-content:center;align-items:center;gap:12px}
.wc-team-label{font-size:14px;font-weight:700;flex:1}
.wc-team-label:first-child{text-align:right}.wc-team-label:last-child{text-align:left}
.wc-score-num{font-size:36px;font-weight:900;min-width:80px;direction:ltr}
.wc-round-info{font-size:12px;opacity:.8;margin-top:2px}
.wc-round-type{text-align:center;padding:8px 0;flex-shrink:0}
.wc-round-emoji{font-size:44px;animation:pulse 1.5s infinite}
.wc-round-label{font-size:18px;font-weight:800;margin-top:2px}
.wc-battle-area{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 10px}
.wc-battle-card{width:125px;height:180px;border-radius:14px;overflow:hidden;transition:all .5s ease;flex-shrink:0}
.wc-battle-card.winner{box-shadow:0 0 24px 8px rgba(76,175,80,.6);transform:scale(1.05)}
.wc-battle-card.loser{opacity:.55;transform:scale(.9);filter:grayscale(.3)}
.wc-battle-card.draw-card{box-shadow:0 0 16px 4px rgba(255,179,0,.5)}
.wc-battle-card.face-down{background:linear-gradient(135deg,#0D47A1,#1A237E);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.wc-battle-card.face-down::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(transparent,rgba(255,255,255,.08) 45%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.08) 55%,transparent);animation:shine 2.5s infinite;transform:rotate(25deg)}
.wc-battle-card.empty-pick{border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05)}
.wc-vs{font-size:24px;font-weight:900;color:#FFB300;text-shadow:0 2px 8px rgba(0,0,0,.5);flex-shrink:0}
.wc-battle-stat{text-align:center;padding:2px 0;flex-shrink:0}
.wc-battle-stat-row{display:flex;justify-content:center;align-items:center;gap:16px}
.wc-battle-stat-val{font-size:28px;font-weight:900;min-width:50px;text-align:center;transition:.5s}
.wc-battle-stat-val.win{color:#4CAF50;transform:scale(1.2)}
.wc-battle-stat-val.lose{color:#EF5350;opacity:.6}
.wc-battle-stat-val.draw-val{color:#FFB300}
.wc-battle-stat-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);padding:2px 12px;border-radius:8px;display:inline-block}
.wc-select-area{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(0,0,0,.25);border-radius:16px 16px 0 0;padding:6px 0}
.wc-select-title{text-align:center;font-size:14px;color:rgba(255,255,255,.7);padding:4px;font-weight:700}
.wc-select-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;align-content:start}
.wc-select-card{height:115px;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s;border:2px solid transparent}
.wc-select-card:active{transform:scale(.95)}
.wc-select-card .player-card{padding:4px 3px 3px;height:100%}
.wc-select-card .pc-top{margin-bottom:0}
.wc-select-card .pc-rating{font-size:13px}
.wc-select-card .pc-pos{font-size:6px}
.wc-select-card .pc-country{font-size:10px}
.wc-select-card .pc-photo,.wc-select-card .pc-photo-placeholder{width:30px;height:30px;font-size:12px;border-width:2px}
.wc-select-card .pc-name{font-size:8px;margin-top:1px}
.wc-select-card .pc-stats-row{gap:2px;margin-top:1px}
.wc-select-card .pc-stat{font-size:5px;padding:1px 3px}
.wc-select-card .pc-stat span{font-size:9px}
.wc-select-card .pc-stars,.wc-select-card .pc-team{display:none}
.wc-highlight-atk .wc-select-card .pc-stat-atk{transform:scale(1.2);outline:1.5px solid rgba(255,255,255,.9);border-radius:4px}
.wc-highlight-def .wc-select-card .pc-stat-def{transform:scale(1.2);outline:1.5px solid rgba(255,255,255,.9);border-radius:4px}
.wc-highlight-ovr .wc-select-card .pc-stat-ovr{transform:scale(1.2);outline:1.5px solid rgba(255,255,255,.9);border-radius:4px}
.wc-action-area{flex-shrink:0;text-align:center;padding:10px 12px;background:rgba(0,0,0,.3)}
.wc-next-btn{padding:12px 28px;border:none;border-radius:14px;background:linear-gradient(135deg,#E65100,#FFB300);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.wc-next-btn:active{transform:scale(.95)}
.wc-final{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;animation:fadeIn .3s}
.wc-final-emoji{font-size:80px;margin-bottom:12px}
.wc-final-score{font-size:52px;font-weight:900;color:#fff;direction:ltr}
.wc-final-text{font-size:22px;color:rgba(255,255,255,.8);margin-top:8px;font-weight:700}
.wc-final-btn{margin-top:20px;padding:14px 32px;border:none;border-radius:14px;background:linear-gradient(135deg,#E65100,#FFB300);color:#fff;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.wc-final-btn:active{transform:scale(.95)}
.wc-back-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;z-index:10;padding:4px 8px}
.wc-round-announce{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:150;animation:fadeIn .2s}
.wc-announce-emoji{font-size:80px;animation:popIn .4s ease}
.wc-announce-text{font-size:28px;font-weight:900;color:#fff;margin-top:12px;animation:popIn .4s ease .1s both}
.wc-announce-sub{font-size:16px;color:rgba(255,255,255,.6);margin-top:4px;animation:popIn .4s ease .2s both}

.celebration-text{
  color:#fff;font-size:28px;font-weight:800;margin-top:20px;
  animation:popIn .5s ease;text-align:center;
}
@keyframes popIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.team-header{
  text-align:center;padding:16px;font-size:20px;font-weight:800;color:var(--pitch);
}
.team-count{text-align:center;font-size:13px;color:var(--text2);margin-top:-8px;padding-bottom:8px}

.reveal-btn,.match-btn{
  display:block;margin:12px auto;padding:14px 32px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.match-btn{background:linear-gradient(135deg,var(--legendary1),var(--legendary2));color:#fff;box-shadow:0 4px 15px rgba(230,81,0,.3)}
.match-btn:active{transform:scale(.95)}

/* old text-match CSS removed — replaced by .wc-* Weekend Challenge styles */


.all-done-banner{
  text-align:center;padding:16px;margin:8px 14px;
  background:linear-gradient(135deg,#FFF8E1,#FFF3E0);
  border-radius:14px;border:2px solid var(--gold);
}
.all-done-banner .banner-emoji{font-size:36px}
.all-done-banner .banner-text{font-size:16px;font-weight:700;color:var(--gold-dark);margin-top:4px}

.empty-msg{text-align:center;padding:32px 16px;color:var(--text3);font-size:14px}


.history-section{padding:16px}
.history-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px}
.history-item{
  background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:13px;color:var(--text2);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;
}

/* Tablet: side-by-side task columns */
.dual-tasks{display:flex;gap:12px;padding:0 14px;flex-wrap:wrap}
.session-toggle{width:100%;display:flex;justify-content:center;gap:8px;padding:10px 0 4px}
.session-btn{
  padding:6px 20px;border:2px solid var(--pitch);border-radius:20px;
  background:transparent;color:var(--pitch);font-size:14px;font-weight:700;
  cursor:pointer;transition:.2s;
}
.session-btn.active{background:var(--pitch);color:#fff}
.dual-day-label{width:100%;text-align:center;font-size:22px;font-weight:700;color:var(--pitch);padding:12px 0 4px}
.kid-column{
  flex:1;min-width:0;background:var(--card);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);
}
.kid-column .col-header{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;
  border-bottom:2px solid #E8F5E9;
}
.kid-column .col-avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
}
.kid-column .col-avatar img{width:100%;height:100%;object-fit:cover}
.kid-column .col-name{font-size:16px;font-weight:700;color:var(--pitch)}
.kid-column .col-progress{
  height:20px;background:#E0E0E0;border-radius:10px;position:relative;
  overflow:visible;display:flex;align-items:center;margin-bottom:8px;
}
.kid-column .col-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--pitch),var(--pitch-light));
  border-radius:10px;transition:width .4s;
}
.kid-column .col-progress-text{
  position:absolute;width:100%;text-align:center;font-size:10px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);direction:ltr;
}
.kid-column .col-task{
  display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;
  border-radius:10px;cursor:pointer;transition:.2s;
}
.kid-column .col-task:active{transform:scale(.97)}
.kid-column .col-task.done{background:#E8F5E9}
.kid-column .col-task.done .col-task-name{text-decoration:line-through;color:var(--text3)}
.kid-column .col-task-icon{font-size:22px;flex-shrink:0}
.kid-column .col-task-name{font-size:14px;font-weight:600;flex:1}
.kid-column .col-task-check{
  width:24px;height:24px;border-radius:50%;border:2px solid #BDBDBD;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:14px;transition:.3s;
}
.kid-column .col-task.done .col-task-check{background:var(--pitch);border-color:var(--pitch);color:#fff}
.kid-column .col-task.special{border:1px solid var(--gold);background:#FFF8E1}
.kid-column .col-task.special.done{background:#E8F5E9;border-color:var(--pitch-light)}
.kid-column .col-done-trophy{text-align:center;padding:8px;font-size:48px}

@media(min-width:700px){
  #app{max-width:900px}
  .header{display:none}
  .single-tasks{display:none}
  .dual-tasks{display:flex}
}
@media(max-width:699px){
  .dual-tasks{display:none}
}
</style>

    S[k]=Object.assign({photo:null,tasks:{},team:[],claimed:[],bonusClaimed:[],history:[],swaps:0,legSwaps:0,
      evTasks:{},evTeam:[],evClaimed:[],evBonusClaimed:[],evHistory:[],evSwaps:0,evLegSwaps:0},S[k]||{});
    if(!S[k].photo&&KID_PHOTOS[k])S[k].photo=KID_PHOTOS[k];
  });
  // Auto-detect session based on time
  const ilH=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Jerusalem'})).getHours();
  S.session=(ilH>=17||ilH<5)?'evening':'morning';
}

function save(){localStorage.setItem('morningChamps',JSON.stringify(S))}

function effectiveNow(){
  const now=new Date();
  const il=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Jerusalem'}));
  if(il.getHours()<5){il.setDate(il.getDate()-1)}
  return il;
}
// Evening uses same 5AM boundary — both sessions reset at 5AM Israel time
function effectiveEveningNow(){return effectiveNow()}
function todayStr(){return effectiveNow().toLocaleDateString('en-CA')}
function eveningTodayStr(){return todayStr()}
function dow(){return effectiveNow().getDay()}
function eveningDow(){return effectiveEveningNow().getDay()}
function isSchoolDay(){const d=dow();return d>=0&&d<=4}
function isEvening(){return S.session==='evening'}

// Session context — returns field names and constants for current session
function ctx(){
  const ev=isEvening();
  return{
    tasks:ev?EVENING_TASKS:COMMON_TASKS,
    draft:ev?EVENING_DRAFT:DAILY_DRAFT,
    d:ev?eveningDow():dow(),
    tk:ev?'evTasks':'tasks',
    tm:ev?'evTeam':'team',
    cl:ev?'evClaimed':'claimed',
    bc:ev?'evBonusClaimed':'bonusClaimed',
    sw:ev?'evSwaps':'swaps',
    lsw:ev?'evLegSwaps':'legSwaps',
    hi:ev?'evHistory':'history',
    label:ev?'ערב':'בוקר',
    emoji:ev?'🌙':'☀️',
  };
}

function checkResets(){
  const today=todayStr();
  // Morning reset at 5 AM
  if(S.lastDate!==today){
    ['yehonatan','yoav'].forEach(k=>{S[k].tasks={};S[k].claimed=[];S[k].bonusClaimed=[];S[k].swaps=0;S[k].legSwaps=0});
    if(dow()===0){
      ['yehonatan','yoav'].forEach(k=>{
        if(S[k].team.length>0){
          S[k].history.unshift({team:[...S[k].team],date:S.weekStart||today});
          if(S[k].history.length>8)S[k].history.pop();
        }
        S[k].team=[];
        if(S[k].evTeam.length>0){
          S[k].evHistory.unshift({team:[...S[k].evTeam],date:S.weekStart||today});
          if(S[k].evHistory.length>8)S[k].evHistory.pop();
        }
        S[k].evTeam=[];
      });
      S.weekStart=today;
    }
    if(!S.weekStart)S.weekStart=today;
    S.lastDate=today;
    save();
  }
  // Evening reset at 5 PM
  const evToday=eveningTodayStr();
  if(S.lastEveningDate!==evToday){
    ['yehonatan','yoav'].forEach(k=>{S[k].evTasks={};S[k].evClaimed=[];S[k].evBonusClaimed=[];S[k].evSwaps=0;S[k].evLegSwaps=0});
    S.lastEveningDate=evToday;
    save();
  }
}

function getTasks(kid){
  const c=ctx();
  let tasks=[...c.tasks];
  // Saturday: no bag (lunch box + water bottle)
  if(!isEvening()&&c.d===6){tasks=tasks.filter(t=>t.id!=='bag')}
  if(!isEvening()){
    (SPECIAL_TASKS[kid]||[]).forEach(t=>{
      if(t.days.includes(c.d))tasks.push({...t,special:true});
    });
  }
  return tasks;
}

function doneCount(kid){const c=ctx();return getTasks(kid).filter(t=>S[kid][c.tk][t.id]).length}
function nonBonusDone(kid){const c=ctx();return getTasks(kid).filter(t=>!t.bonus&&S[kid][c.tk][t.id]).length}
function nonBonusTotal(kid){return getTasks(kid).filter(t=>!t.bonus).length}

function getMilestones(kid){
  const c=ctx();
  const draft=c.draft[c.d];
  if(!draft)return[];
  const total=nonBonusTotal(kid);
  const divisor=Math.max(draft.length,2); // single-pick days: need ~50% not 100%
  return draft.map((slot,i)=>({...slot,threshold:Math.ceil(total*(i+1)/divisor),index:i}));
}

function getNextMilestone(kid){
  const c=ctx();
  const ms=getMilestones(kid);
  const done=nonBonusDone(kid);
  return ms.find(m=>done>=m.threshold&&!S[kid][c.cl].includes(m.index));
}

function getPlayerById(id){return PLAYERS.find(p=>p.id===id)}

function getDraftOptions(kid,generalPos){
  const c=ctx();
  const taken=new Set(S[kid][c.tm].map(t=>t.playerId));
  const eligible=PLAYERS.filter(p=>{
    if(LEGENDS.includes(p.id))return false;
    if(taken.has(p.id))return false;
    return generalPos==='ANY'||p.pos===generalPos;
  });
  return eligible.sort(()=>Math.random()-.5).slice(0,3);
}

function autoFillTeam(kid){
  const c=ctx();
  const team=S[kid][c.tm];
  const filled=new Set(team.map(t=>t.pos));
  // Fill formation positions first, then bench
  const allPositions=[...Object.keys(FORMATION_POS),'BENCH1','BENCH2','BENCH3'];
  allPositions.forEach(pos=>{
    if(filled.has(pos))return;
    const gp=POS_MAP[pos];
    const taken=new Set(team.map(t=>t.playerId));
    const eligible=PLAYERS.filter(p=>{
      if(LEGENDS.includes(p.id))return false;
      if(taken.has(p.id))return false;
      return gp==='ANY'||p.pos===gp;
    });
    if(eligible.length){
      const pick=eligible[Math.floor(Math.random()*eligible.length)];
      team.push({playerId:pick.id,pos,day:-1});
    }
  });
}

function render(){
  const app=document.getElementById('app');
  document.body.classList.toggle('evening-mode',isEvening());
  app.classList.toggle('evening-mode',isEvening());
  if(S.view==='match'){if(!wcMatch){S.view='team'}else{app.innerHTML=renderMatchView();bindEvents();return}}
  app.innerHTML=renderHeader()+`<div class="main-scroll" id="main">${
    S.view==='tasks'?renderTasksView():renderTeamView()
  }</div>`+renderNav();
  bindEvents();
}

function renderHeader(){
  const kids=Object.keys(KIDS);
  // Active kid in the center
  const sorted=[...kids].sort((a,b)=>a===S.currentKid?-1:b===S.currentKid?1:0);
  return `<div class="header">
    ${sorted.map(k=>renderKidBtn(k)).join('')}
  </div>`;
}

function renderKidBtn(kid){
  const info=KIDS[kid];
  const active=S.currentKid===kid?'active':'';
  const photo=S[kid].photo;
  return `<div class="kid-btn ${active}" data-switch="${kid}">
    <div class="kid-avatar-wrap">
      <div class="kid-avatar" style="${!photo?'background:'+info.color:''}">
        ${photo?`<img src="${photo}" alt="${info.name}">`:`<span>${info.initials}</span>`}
      </div>
      <div class="photo-badge">📷</div>
    </div>
    <div class="kid-label">${info.name}</div>
  </div>`;
}

function renderKidColumn(kid){
  const info=KIDS[kid];
  const tasks=getTasks(kid);
  const done=doneCount(kid);
  const total=tasks.length;
  const allDone=done===total;
  const pct=total?Math.round(done/total*100):0;

  let html=`<div class="kid-column">
    <div class="col-header">
      <div class="col-avatar" style="background:${info.color}">${S[kid].photo?`<img src="${S[kid].photo}">`:`<span>${info.name[0]}</span>`}</div>
      <div class="col-name">${info.name} <span style="color:var(--text3);font-weight:400">(${done})</span></div>
    </div>
    <div class="col-progress">
      <div class="col-progress-fill" style="width:${pct}%"></div>
      <div class="col-progress-text">${done} / ${total}</div>
    </div>`;

  if(allDone&&isSchoolDay()){
    html+=`<div class="col-done-trophy">\u{1F3C6}</div>`;
  }

  const c=ctx();
  html+=tasks.map(t=>{
    const isDone=S[kid][c.tk][t.id];
    return `<div class="col-task ${isDone?'done':''} ${t.special?'special':''} ${t.bonus?'bonus':''} ${t.legendary?'legendary':''}" data-kid="${kid}" data-col-task="${t.id}">
      <div class="col-task-icon">${t.icon}</div>
      <div class="col-task-name">${t.name}${t.legendary?' 👑':t.bonus?' ⭐':''}</div>
      <div class="col-task-check">${isDone?'✓':''}</div>
    </div>`;
  }).join('');

  html+=`</div>`;
  return html;
}

function renderSessionToggle(){
  return `<div class="session-toggle">
    <button class="session-btn ${S.session==='morning'?'active':''}" data-session="morning">☀️ בוקר</button>
    <button class="session-btn ${S.session==='evening'?'active':''}" data-session="evening">🌙 ערב</button>
  </div>`;
}

function renderTasksView(){
  const c=ctx();
  const kid=S.currentKid;
  const info=KIDS[kid];
  const tasks=getTasks(kid);
  const done=doneCount(kid);
  const total=tasks.length;
  const allDone=done===total;
  const ms=getMilestones(kid);
  const pct=total?Math.round(done/total*100):0;
  const dayName=DAY_NAMES[c.d];

  // Tablet: dual columns
  let html=`<div class="dual-tasks">`;
  html+=renderSessionToggle();
  html+=`<div class="dual-day-label">${c.emoji} יום ${dayName} — ${c.label} <span class="reset-btn" data-action="reset-day">↩</span></div>`;
  Object.keys(KIDS).forEach(k=>{html+=renderKidColumn(k)});
  html+=`</div>`;

  // Mobile: single kid view
  html+=`<div class="single-tasks">`;
  html+=renderSessionToggle();
  html+=`<div class="day-label" style="padding-top:10px">${c.emoji} יום ${dayName} — ${c.label} <span class="reset-btn" data-action="reset-day">↩</span></div>`;

  html+=`<div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" style="width:${pct}%"></div>
      <div class="progress-text">${done} / ${total}</div>
    </div>
    ${ms.length?`<div class="milestones">${ms.map(m=>{
      const nb=nonBonusDone(kid);
      const reached=nb>=m.threshold;
      const next=!reached&&ms.filter(mm=>nb>=mm.threshold).length===ms.indexOf(m);
      return `<span class="milestone ${reached?'reached':''} ${next?'next':''}">⚽</span>`;
    }).join('')}</div>`:''}
  </div>`;

  if(allDone&&isSchoolDay()){
    html+=`<div class="all-done-banner">
      <div class="banner-emoji" style="font-size:64px">\u{1F3C6}</div>
    </div>`;
  }

  html+=`<div class="task-list">${tasks.map(t=>{
    const isDone=S[kid][c.tk][t.id];
    return `<div class="task-item ${isDone?'done':''} ${t.special?'special':''} ${t.bonus?'bonus':''} ${t.legendary?'legendary':''}" data-task="${t.id}">
      ${t.special?'<div class="task-special-badge">היום!</div>':''}
      <div class="task-icon">${t.icon}</div>
      <div class="task-name">${t.name}</div>
      <div class="task-check">${isDone?'✓':''}</div>
    </div>`;
  }).join('')}</div>`;

  const team=S[kid][c.tm];
  if(team.length>0){
    html+=`<div class="team-preview">
      <div class="team-preview-title">⚽ הנבחרת ${c.label} שלי (${team.length}/${TEAM_SIZE})</div>
    </div>`;
  }

  html+=`</div>`; // close single-tasks
  return html;
}

function renderTeamForKid(kid){
  const c=ctx();
  const info=KIDS[kid];
  const team=S[kid][c.tm];
  const isShabat=c.d===6;
  const isComplete=team.length>=TEAM_SIZE;

  if(isShabat&&team.length>0&&team.length<TEAM_SIZE){
    autoFillTeam(kid);
    save();
  }

  const hl=(S._highlightKid===kid||!S._highlightKid)?S._highlightPos||null:null;
  const swapMode=(S._swapKid===kid)?S._swapMode||false:false;
  let html=`<div class="team-header">${c.emoji} נבחרת ${c.label} — ${info.name}</div>`;
  html+=`<div class="team-count">${team.length}/${TEAM_SIZE} שחקנים</div>`;
  html+=renderPitch(kid,hl,swapMode);
  html+=renderBench(kid,swapMode);

  if(S._benchSwapKid===kid&&S._benchSwapPos){
    html+=`<div class="swap-hint">בחר מקום במגרש להחלפה</div>`;
  }else if(swapMode){
    html+=`<div class="swap-hint">לחץ על שחקן להחלפה</div>`;
  }else{
    if(S[kid][c.lsw]>0&&team.length>0){
      html+=`<button class="swap-btn" style="background:linear-gradient(135deg,#7B1FA2,#CE93D8)" data-leg-swap-kid="${kid}">👑 החלפה אגדית (${S[kid][c.lsw]})</button>`;
    }
    if(S[kid][c.sw]>0&&team.length>0){
      html+=`<button class="swap-btn" data-swap-kid="${kid}">🔄 החלף שחקן (${S[kid][c.sw]})</button>`;
    }
  }

  if(isComplete||isShabat&&team.length>=TEAM_SIZE){
    html+=`<button class="match-btn" data-match-kid="${kid}">⚽ אתגר את המחשב!</button>`;
  }

  if(S[kid][c.hi].length>0){
    html+=`<div class="history-section"><div class="history-title">\u{1F3C6} נבחרות ${c.label} קודמות</div>`;
    S[kid][c.hi].forEach((h,i)=>{
      const players=h.team.map(t=>getPlayerById(t.playerId)).filter(Boolean);
      const names=players.slice(0,3).map(p=>p.name).join(', ');
      html+=`<div class="history-item" data-kid="${kid}" data-history="${i}">
        <span>${names}${players.length>3?' ...':''}</span>
        <span style="font-size:11px;color:var(--text3)">${h.date||''}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  if(!isSchoolDay()&&team.length===0){
    html+=`<div class="empty-msg">\u{1F31F} ביום ראשון מתחילים לבנות נבחרת חדשה!</div>`;
  }

  return html;
}

function renderTeamView(){
  S._highlightPos=null;
  S._highlightKid=null;

  // Tablet: both kids
  let html=`<div class="dual-tasks">`;
  html+=renderSessionToggle();
  Object.keys(KIDS).forEach(k=>{
    html+=`<div class="kid-column">${renderTeamForKid(k)}</div>`;
  });
  html+=`</div>`;

  // Mobile: single kid
  html+=`<div class="single-tasks">`;
  html+=renderSessionToggle();
  html+=renderTeamForKid(S.currentKid);
  html+=`</div>`;

  return html;
}

function renderPitch(kid,highlightPos,swapMode){
  const c=ctx();
  const team=S[kid][c.tm];
  const byPos={};
  team.forEach(t=>{byPos[t.pos]=getPlayerById(t.playerId)});
  const benchSwapActive=S._benchSwapKid===kid&&S._benchSwapPos;

  let slots='';
  Object.entries(FORMATION_POS).forEach(([pos,coord])=>{
    const p=byPos[pos];
    const bst=benchSwapActive?' bench-swap-target':'';
    if(p){
      const ph=PLAYER_PHOTOS[p.id];
      const hl=pos===highlightPos?' just-drafted':'';
      const sw=swapMode?' swappable':'';
      slots+=`<div class="slot pop${hl}${sw}${bst}" style="left:${coord.l}%;top:${coord.t}%" ${swapMode?`data-swap-pos="${pos}"`:''} ${benchSwapActive?`data-bench-target="${pos}"`:''}>
        <div class="slot-filled">
          ${ph?`<img class="slot-photo" src="${ph}" alt="${p.name}" style="border-color:${rarityColor(p.rarity)}">`:`<div class="slot-photo-placeholder" style="border-color:${rarityColor(p.rarity)}">${p.num}</div>`}
          <div class="slot-name">${p.name}</div>
        </div>
        <div class="slot-label">${POS_LABELS[pos]}</div>
      </div>`;
    }else{
      slots+=`<div class="slot${bst}" style="left:${coord.l}%;top:${coord.t}%" ${benchSwapActive?`data-bench-target="${pos}"`:''}>
        <div class="slot-empty"><span style="font-size:14px;color:rgba(255,255,255,.3)">?</span></div>
        <div class="slot-label">${POS_LABELS[pos]}</div>
      </div>`;
    }
  });

  return `<div style="padding:0 14px"><div class="pitch">
    <div class="pitch-lines">
      <div class="pitch-center-dot"></div>
      <div class="pitch-box-top"></div>
      <div class="pitch-box-bottom"></div>
      <div class="pitch-goal-top"></div>
      <div class="pitch-goal-bottom"></div>
    </div>
    ${slots}
  </div></div>`;
}

function rarityColor(r){return['#66BB6A','#42A5F5','#CE93D8','#FFB300'][r]||'#fff'}

function renderBench(kid,swapMode){
  const c=ctx();
  const team=S[kid][c.tm];
  const benchPositions=['BENCH1','BENCH2','BENCH3'];
  const selectedBench=S._benchSwapKid===kid?S._benchSwapPos:null;
  let slots=benchPositions.map(pos=>{
    const entry=team.find(t=>t.pos===pos);
    if(entry){
      const p=getPlayerById(entry.playerId);
      if(!p)return '';
      const photo=PLAYER_PHOTOS[p.id];
      const sw=swapMode?` data-swap-pos="${pos}"`:'';
      const sel=selectedBench===pos?' bench-selected':'';
      return `<div class="bench-slot${sel}"${sw} data-bench-pick="${pos}">
        ${photo?`<img src="${photo}" style="width:40px;height:40px;border-radius:50%;border:2px solid ${rarityColor(p.rarity)}">`
        :`<div style="width:40px;height:40px;border-radius:50%;background:${rarityColor(p.rarity)};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px">${p.num}</div>`}
        <div style="font-size:10px;font-weight:700;margin-top:2px">${p.name}</div>
        <div class="slot-label">ספסל</div>
      </div>`;
    }else{
      return `<div class="bench-slot">
        <div style="width:40px;height:40px;border-radius:50%;border:2px dashed rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.3);font-size:16px">?</div>
        <div class="slot-label">ספסל</div>
      </div>`;
    }
  }).join('');
  return `<div class="bench-row">${slots}</div>`;
}

function renderNav(){
  return `<div class="bottom-nav">
    <div class="nav-tab ${S.view==='team'?'active':''}" data-view="team">
      <span class="nav-tab-icon">⚽</span>הנבחרת
    </div>
    <div class="nav-tab ${S.view==='tasks'?'active':''}" data-view="tasks">
      <span class="nav-tab-icon">\u{1F4CB}</span>משימות
    </div>
  </div>`;
}

function showDraft(milestone,legendaryOptions){
  const kid=S.currentKid;
  const gp=POS_MAP[milestone.pos];
  const options=legendaryOptions||getDraftOptions(kid,gp);
  if(options.length===0)return;

  const overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.id='draft-overlay';

  const isSwap=milestone.index<0;
  let cardsHtml=options.map((p,i)=>`
    <div class="draft-card ${isSwap?'flipped':''}" data-pick="${p.id}" data-pos="${milestone.pos}" data-idx="${milestone.index}">
      <div class="draft-card-inner">
        <div class="draft-card-face card-back card-back-${i}">
          <span>⚽</span>
        </div>
        <div class="draft-card-face card-front">
          ${renderPlayerCard(p)}
        </div>
      </div>
    </div>
  `).join('');

  overlay.innerHTML=`
    <div class="draft-title">${isSwap?'🔄':'🎉'} בחר ${milestone.label}!</div>
    <div class="draft-subtitle">${isSwap?'בחר שחקן':'לחץ על קלף'}</div>
    <div class="draft-cards">${cardsHtml}</div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelectorAll('.draft-card').forEach(card=>{
    card.addEventListener('click',function(){
      if(this.dataset.picked)return;
      this.dataset.picked='1';
      const pid=this.dataset.pick;
      const pos=this.dataset.pos;
      const idx=parseInt(this.dataset.idx);

      this.classList.add('flipped');
      overlay.querySelectorAll('.draft-card').forEach(c=>{
        if(c!==this)c.classList.add('not-picked');
      });

      const _c=ctx();
      S[kid][_c.tm].push({playerId:pid,pos,day:_c.d});
      if(idx>=0)S[kid][_c.cl].push(idx);
      save();

      const player=getPlayerById(pid);
      setTimeout(()=>{
        showConfetti(player.rarity>=2);
      },700);

      setTimeout(()=>{
        overlay.remove();
        S._highlightPos=pos;
        S._highlightKid=kid;
        S.view='team';
        render();
        document.querySelectorAll('.slot.just-drafted').forEach(el=>el.scrollIntoView({behavior:'smooth',block:'center'}));
        const next=getNextMilestone(kid);
        if(next){
          setTimeout(()=>{S.view='tasks';render();setTimeout(()=>showDraft(next),400)},2000);
        }else{
          setTimeout(()=>{S.view='tasks';render()},3000);
        }
      },2800);
    });
  });
}

function showSwapNotification(kid){
  const info=KIDS[kid];
  const overlay=document.createElement('div');
  overlay.className='swap-notify';
  overlay.innerHTML=`
    <div class="swap-notify-box">

      <div class="swap-notify-title">כל הכבוד ${info.name}!</div>

      <button class="swap-notify-btn" id="go-to-swap">לנבחרת →</button>

  `;

  overlay.querySelector('#go-to-swap').addEventListener('click',()=>{
    overlay.remove();
    S.currentKid=kid;

    save();render();
  });
}

function showLegendarySwapNotification(kid){
  const info=KIDS[kid];
  const overlay=document.createElement('div');
  overlay.className='swap-notify';
  overlay.innerHTML=`
    <div class="swap-notify-box" style="border:3px solid #7B1FA2;background:linear-gradient(135deg,#F3E5F5,#fff)">
      <div class="swap-notify-icon">👑🔄</div>

const ROUND_TYPES=[
  {type:'atk',emoji:'⚽',label:'התקפה!',stat:'atk',color:'#D32F2F',statLabel:'ATK'},
  {type:'def',emoji:'🛡️',label:'הגנה!',stat:'def',color:'#1565C0',statLabel:'DEF'},
  {type:'ovr',emoji:'🏆',label:'מי הטוב ביותר?',stat:'ovr',color:'#E6A200',statLabel:'OVR'},
];

let wcMatch=null; // current match state

function generateMatchRounds(){
  const rounds=[
    ROUND_TYPES[0],ROUND_TYPES[0],ROUND_TYPES[0],
    ROUND_TYPES[1],ROUND_TYPES[1],
    ROUND_TYPES[2],ROUND_TYPES[2],
  ];
  for(let i=rounds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rounds[i],rounds[j]]=[rounds[j],rounds[i]]}
  return rounds;
}

function generateComputerTeam(kid){
  const c=ctx();
  const kidIds=new Set(S[kid][c.tm].map(t=>t.playerId));
  const pool=PLAYERS.filter(p=>!LEGENDS.includes(p.id)&&!kidIds.has(p.id));
  // Take top 20 by OVR, then randomly pick 14 for variety
  const top=pool.sort((a,b)=>b.ovr-a.ovr).slice(0,22);
  for(let i=top.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[top[i],top[j]]=[top[j],top[i]]}
  return top.slice(0,14);
}

function getComputerPick(roundType,usedIds,computerTeam){
  const available=computerTeam.filter(p=>!usedIds.has(p.id));
  if(!available.length)return null;
  const stat=roundType.stat;
  const sorted=[...available].sort((a,b)=>b[stat]-a[stat]);
  // Pick from top 4 randomly — smart but not perfect
  const n=Math.min(4,sorted.length);
  return sorted[Math.floor(Math.random()*n)];
}

function pickMatchPlayer(playerId){
  const m=wcMatch;
  if(!m||m.phase!=='pick')return;
  const ri=m.rounds[m.round];
  const homePick=getPlayerById(playerId);
  if(!homePick)return;
  const awayPick=getComputerPick(ri,m.usedAway,m.computerTeam);
  if(!awayPick)return;
  // Mark both as used only after both picks succeed
  m.homePick=homePick;
  m.usedHome.add(playerId);
  m.awayPick=awayPick;
  m.usedAway.add(awayPick.id);
  const stat=ri.stat;
  if(homePick[stat]>awayPick[stat])m.homeScore++;
  else if(awayPick[stat]>homePick[stat])m.awayScore++;
  m.phase='battle';
  render();
  if(homePick[stat]>awayPick[stat])setTimeout(()=>showConfetti(false),300);
}

function nextMatchRound(){
  const m=wcMatch;

  m.phase='pick';m.homePick=null;m.awayPick=null;

          showSwapNotification(kid);

      S._legendarySwap=false;

function resizeImage(dataUri,maxSize){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('Invalid image'));
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>h){h=h*maxSize/w;w=maxSize}else{w=w*maxSize/h;h=maxSize}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',.8));
    };
    img.src=dataUri;
  });
}

const confettiCanvas=document.getElementById('confetti-canvas');
const confettiCtx=confettiCanvas.getContext('2d');
let confettiParticles=[],confettiRunning=false;

function showConfetti(big){
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
  const colors=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#FFD700','#FF69B4','#7C4DFF','#00E676'];
  const count=big?150:80;
  const spread=big?window.innerWidth:window.innerWidth*.8;
  const startX=window.innerWidth/2;

  for(let i=0;i<count;i++){
    confettiParticles.push({
      x:startX+(Math.random()-.5)*spread*.3,
      y:big?-20:window.innerHeight*.3,
      vx:(Math.random()-.5)*(big?14:8),
      vy:-(Math.random()*(big?14:8)+3),
      size:Math.random()*8+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      rotV:(Math.random()-.5)*12,
      life:1
    });
  }
  if(!confettiRunning){confettiRunning=true;animateConfetti()}
}

function animateConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParticles=confettiParticles.filter(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.25;
    p.vx*=.99;
    p.rot+=p.rotV;
    p.life-=.008;
    if(p.life<=0||p.y>confettiCanvas.height+20)return false;
    confettiCtx.save();
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rot*Math.PI/180);
    confettiCtx.globalAlpha=p.life;
    confettiCtx.fillStyle=p.color;
    confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
    confettiCtx.restore();
    return true;
  });
  if(confettiParticles.length)requestAnimationFrame(animateConfetti);
  else{confettiRunning=false;confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height)}
}

load();
checkResets();
render();

window.addEventListener('resize',()=>{
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
});
</script>
