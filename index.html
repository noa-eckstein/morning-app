<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B5E20">
<title>בוקר של אלופים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pitch:#2E7D32;--pitch-light:#43A047;--gold:#FFB300;--gold-dark:#E65100;
  --bg:#F1F8E9;--card:#fff;--text:#212121;--text2:#616161;--text3:#9E9E9E;
  --shadow:0 2px 12px rgba(0,0,0,.12);--radius:16px;
  --legendary1:#E65100;--legendary2:#FFB300;
  --epic1:#7B1FA2;--epic2:#CE93D8;
  --rare1:#1565C0;--rare2:#42A5F5;
  --common1:#2E7D32;--common2:#66BB6A;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
#app{height:100%;display:flex;flex-direction:column;max-width:500px;margin:0 auto;overflow:hidden}
.header{
  background:linear-gradient(135deg,#1B5E20,#2E7D32);
  padding:10px 16px 8px;display:flex;align-items:center;justify-content:center;gap:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:10;flex-shrink:0;
}
.kid-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;transition:.25s;flex-shrink:0;
}
.kid-btn .kid-avatar{
  width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  background:#455A64;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;overflow:hidden;transition:.25s;
}
.kid-btn.active .kid-avatar{
  width:60px;height:60px;border:3px solid var(--gold);
  box-shadow:0 0 14px rgba(255,179,0,.5);font-size:18px;
}
.kid-btn .kid-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.kid-btn .kid-label{
  font-size:10px;color:rgba(255,255,255,.5);font-weight:600;transition:.2s;
}
.kid-btn.active .kid-label{font-size:13px;color:#fff}
.kid-btn .photo-badge{
  position:absolute;bottom:0;right:0;width:16px;height:16px;
  background:var(--gold);border-radius:50%;font-size:8px;
  display:none;align-items:center;justify-content:center;
  border:2px solid #1B5E20;
}
.kid-btn.active .photo-badge{display:flex}
.kid-btn .kid-avatar-wrap{position:relative}
.greeting{
  text-align:center;padding:14px 16px 6px;font-size:20px;font-weight:700;color:var(--pitch);
}
.day-label{text-align:center;font-size:13px;color:var(--text2);padding-bottom:8px}
.progress-wrap{padding:0 20px 10px}
.progress-bar{
  height:28px;background:#E0E0E0;border-radius:14px;position:relative;overflow:visible;
  display:flex;align-items:center;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--pitch),var(--pitch-light));
  border-radius:14px;transition:width .4s ease;min-width:0;
}
.progress-text{
  position:absolute;width:100%;text-align:center;font-size:12px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);z-index:2;direction:ltr;
}
.milestones{display:flex;justify-content:space-between;padding:4px 4px 0;direction:ltr}
.milestone{font-size:14px;opacity:.4;transition:.3s}
.milestone.reached{opacity:1;transform:scale(1.3)}
.milestone.next{animation:pulse 1.5s infinite}
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.task-list{padding:0 14px}
.task-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;margin:6px 0;
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  cursor:pointer;transition:all .3s;position:relative;overflow:hidden;
}
.task-item:active{transform:scale(.97)}
.task-item.done{background:#E8F5E9}
.task-item.done .task-name{text-decoration:line-through;color:var(--text3)}
.task-item.special{border:2px solid var(--gold);background:#FFF8E1}
.task-item.special.done{background:#F1F8E9;border-color:var(--pitch-light)}
.task-icon{font-size:28px;flex-shrink:0;width:36px;text-align:center}
.task-name{font-size:17px;font-weight:600;flex:1}
.task-special-badge{
  font-size:10px;background:var(--gold);color:#fff;padding:2px 6px;
  border-radius:8px;font-weight:700;position:absolute;top:6px;left:6px;
}
.task-check{
  width:32px;height:32px;border-radius:50%;border:3px solid #BDBDBD;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:.3s;font-size:18px;
}
.task-item.done .task-check{background:var(--pitch);border-color:var(--pitch);color:#fff}

.team-preview{padding:12px 14px}
.team-preview-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px;text-align:center}
.pitch{
  position:relative;width:100%;padding-top:120%;background:var(--pitch);
  border-radius:var(--radius);overflow:hidden;direction:ltr;
  box-shadow:inset 0 0 30px rgba(0,0,0,.15);
}
.pitch-lines{position:absolute;inset:0}
.pitch-lines::before{
  content:'';position:absolute;top:50%;left:8%;right:8%;height:2px;
  background:rgba(255,255,255,.25);
}
.pitch-lines::after{
  content:'';position:absolute;top:50%;left:50%;width:18%;padding-top:18%;
  transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.25);border-radius:50%;
}
.pitch-center-dot{
  position:absolute;top:50%;left:50%;width:6px;height:6px;
  background:rgba(255,255,255,.3);border-radius:50%;transform:translate(-50%,-50%);
}
.pitch-box-top{
  position:absolute;top:0;left:25%;right:25%;height:18%;
  border:2px solid rgba(255,255,255,.2);border-top:none;border-radius:0 0 4px 4px;
}
.pitch-box-bottom{
  position:absolute;bottom:0;left:25%;right:25%;height:18%;
  border:2px solid rgba(255,255,255,.2);border-bottom:none;border-radius:4px 4px 0 0;
}
.pitch-goal-top{
  position:absolute;top:0;left:38%;right:38%;height:7%;
  border:2px solid rgba(255,255,255,.15);border-top:none;
}
.pitch-goal-bottom{
  position:absolute;bottom:0;left:38%;right:38%;height:7%;
  border:2px solid rgba(255,255,255,.15);border-bottom:none;
}
.slot{
  position:absolute;transform:translate(-50%,-50%);text-align:center;
  width:54px;transition:.3s;
}
.slot-empty{
  width:40px;height:40px;border:2px dashed rgba(255,255,255,.4);border-radius:50%;
  display:flex;align-items:center;justify-content:center;margin:0 auto 2px;
}
.slot-empty-label{font-size:8px;color:rgba(255,255,255,.5);font-weight:600}
.slot-label{font-size:9px;color:rgba(255,255,255,.6);font-weight:600;margin-top:1px}
.slot-filled{
  width:50px;text-align:center;margin:0 auto 2px;
}
.slot-photo{
  width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);display:block;margin:0 auto;
}
.slot-photo-placeholder{
  width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;margin:0 auto;
  font-size:16px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4);
}
.slot-filled .slot-name{font-size:9px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.slot.pop{animation:popIn .4s ease}
.slot.just-drafted{animation:draftGlow 1.5s ease infinite}
.slot.just-drafted .slot-photo,.slot.just-drafted .slot-photo-placeholder{box-shadow:0 0 16px 4px var(--gold)}
@keyframes draftGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.bottom-nav{
  display:flex;background:#fff;border-top:1px solid #E0E0E0;flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-tab{
  flex:1;padding:10px;text-align:center;cursor:pointer;
  font-size:13px;font-weight:600;color:var(--text3);transition:.2s;
}
.nav-tab.active{color:var(--pitch)}
.nav-tab-icon{font-size:22px;display:block;margin-bottom:2px}

.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  animation:fadeIn .3s;backdrop-filter:blur(4px);
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.draft-title{color:#fff;font-size:24px;font-weight:800;margin-bottom:24px;text-align:center}
.draft-subtitle{color:rgba(255,255,255,.7);font-size:14px;margin-top:-16px;margin-bottom:20px}
.draft-cards{display:flex;gap:10px;direction:ltr;padding:0 12px}
.draft-card{
  width:110px;height:160px;perspective:1000px;cursor:pointer;flex-shrink:0;
}
.draft-card-inner{
  width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;position:relative;
}
.draft-card.flipped .draft-card-inner{transform:rotateY(180deg)}
.draft-card.not-picked{opacity:0;transform:scale(.8);transition:.4s}
.draft-card-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:14px;overflow:hidden;
}
.card-back{
  background:linear-gradient(135deg,#0D47A1,#1A237E);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-size:40px;position:relative;overflow:hidden;gap:4px;
}
.card-back-1{background:linear-gradient(135deg,#AD1457,#6A1B9A)}
.card-back-2{background:linear-gradient(135deg,#E65100,#F57F17)}
.card-back::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:linear-gradient(transparent 0%,rgba(255,255,255,.08) 45%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.08) 55%,transparent 100%);
  animation:shine 2.5s infinite;transform:rotate(25deg);
}
@keyframes shine{0%{transform:translateX(-100%) rotate(25deg)}100%{transform:translateX(100%) rotate(25deg)}}
.card-front{transform:rotateY(180deg)}

.player-card{
  width:100%;height:100%;border-radius:14px;padding:8px 6px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;text-shadow:1px 1px 2px rgba(0,0,0,.3);position:relative;
}
.player-card.rarity-3{background:linear-gradient(135deg,var(--legendary1),var(--legendary2))}
.player-card.rarity-2{background:linear-gradient(135deg,var(--epic1),var(--epic2))}
.player-card.rarity-1{background:linear-gradient(135deg,var(--rare1),var(--rare2))}
.player-card.rarity-0{background:linear-gradient(135deg,var(--common1),var(--common2))}
.pc-top{display:flex;justify-content:space-between;width:100%;font-size:10px;font-weight:700;margin-bottom:4px}
.pc-rating{font-size:20px;font-weight:900;line-height:1}
.pc-pos{font-size:9px;opacity:.8;margin-top:1px}
.pc-photo{
  width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:3px solid rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.pc-photo-placeholder{
  width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;border:3px solid rgba(255,255,255,.4);
}
.pc-name{font-size:14px;font-weight:800;margin-top:4px}
.pc-team{font-size:9px;opacity:.7;display:flex;align-items:center;gap:3px;margin-top:1px}
.pc-team-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pc-stars{font-size:9px;margin-top:1px}

.celebration-text{
  color:#fff;font-size:28px;font-weight:800;margin-top:20px;
  animation:popIn .5s ease;text-align:center;
}
@keyframes popIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

.team-header{
  text-align:center;padding:16px;font-size:20px;font-weight:800;color:var(--pitch);
}
.team-count{text-align:center;font-size:13px;color:var(--text2);margin-top:-8px;padding-bottom:8px}

.reveal-btn,.match-btn{
  display:block;margin:12px auto;padding:14px 32px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.match-btn{background:linear-gradient(135deg,var(--legendary1),var(--legendary2));color:#fff;box-shadow:0 4px 15px rgba(230,81,0,.3)}
.match-btn:active{transform:scale(.95)}

.match-view{padding:16px;height:100%;display:flex;flex-direction:column}
.match-scoreboard{
  background:linear-gradient(135deg,#1B5E20,#2E7D32);color:#fff;border-radius:14px;
  padding:16px;text-align:center;margin-bottom:12px;flex-shrink:0;
}
.match-teams{display:flex;justify-content:space-around;align-items:center;gap:8px}
.match-team-name{font-size:13px;font-weight:700;flex:1}
.match-score{font-size:36px;font-weight:900;min-width:80px}
.match-minute{font-size:12px;opacity:.7;margin-top:4px}
.match-events{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:14px;padding:12px;
}
.match-event{
  padding:8px 0;border-bottom:1px solid #F5F5F5;font-size:14px;
  animation:slideUp .3s ease;
}
.match-event:last-child{border:none}
.match-event.goal{color:var(--pitch);font-weight:700;font-size:16px}
.match-event.halftime{color:var(--text2);text-align:center;font-style:italic}
.match-event.fulltime{color:var(--gold-dark);font-weight:800;font-size:17px;text-align:center}
.event-min{color:var(--text3);font-weight:700;margin-left:8px;display:inline-block;min-width:32px}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.match-back{
  display:block;margin:12px auto 0;padding:10px 24px;border:2px solid var(--pitch);
  background:transparent;border-radius:10px;color:var(--pitch);font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;
}


.all-done-banner{
  text-align:center;padding:16px;margin:8px 14px;
  background:linear-gradient(135deg,#FFF8E1,#FFF3E0);
  border-radius:14px;border:2px solid var(--gold);
}
.all-done-banner .banner-emoji{font-size:36px}
.all-done-banner .banner-text{font-size:16px;font-weight:700;color:var(--gold-dark);margin-top:4px}

.empty-msg{text-align:center;padding:32px 16px;color:var(--text3);font-size:14px}


.history-section{padding:16px}
.history-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px}
.history-item{
  background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:6px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:13px;color:var(--text2);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;
}

/* Tablet: side-by-side task columns */
.dual-tasks{display:flex;gap:12px;padding:0 14px;flex-wrap:wrap}
.dual-day-label{width:100%;text-align:center;font-size:22px;font-weight:700;color:var(--pitch);padding:12px 0 4px}
.kid-column{
  flex:1;min-width:0;background:var(--card);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);
}
.kid-column .col-header{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;
  border-bottom:2px solid #E8F5E9;
}
.kid-column .col-avatar{
  width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
}
.kid-column .col-avatar img{width:100%;height:100%;object-fit:cover}
.kid-column .col-name{font-size:16px;font-weight:700;color:var(--pitch)}
.kid-column .col-progress{
  height:20px;background:#E0E0E0;border-radius:10px;position:relative;
  overflow:visible;display:flex;align-items:center;margin-bottom:8px;
}
.kid-column .col-progress-fill{
  height:100%;background:linear-gradient(90deg,var(--pitch),var(--pitch-light));
  border-radius:10px;transition:width .4s;
}
.kid-column .col-progress-text{
  position:absolute;width:100%;text-align:center;font-size:10px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);direction:ltr;
}
.kid-column .col-task{
  display:flex;align-items:center;gap:8px;padding:8px;margin:4px 0;
  border-radius:10px;cursor:pointer;transition:.2s;
}
.kid-column .col-task:active{transform:scale(.97)}
.kid-column .col-task.done{background:#E8F5E9}
.kid-column .col-task.done .col-task-name{text-decoration:line-through;color:var(--text3)}
.kid-column .col-task-icon{font-size:22px;flex-shrink:0}
.kid-column .col-task-name{font-size:14px;font-weight:600;flex:1}
.kid-column .col-task-check{
  width:24px;height:24px;border-radius:50%;border:2px solid #BDBDBD;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:14px;transition:.3s;
}
.kid-column .col-task.done .col-task-check{background:var(--pitch);border-color:var(--pitch);color:#fff}
.kid-column .col-task.special{border:1px solid var(--gold);background:#FFF8E1}
.kid-column .col-task.special.done{background:#E8F5E9;border-color:var(--pitch-light)}
.kid-column .col-done-trophy{text-align:center;padding:8px;font-size:48px}

@media(min-width:700px){
  #app{max-width:900px}
  .header{display:none}
  .single-tasks{display:none}
  .dual-tasks{display:flex}
}
@media(max-width:699px){
  .dual-tasks{display:none}
}
</style>
</head>

  S=Object.assign({currentKid:'yehonatan',view:'tasks',lastDate:null,weekStart:null},S);
  ['yehonatan','yoav'].forEach(k=>{
    S[k]=Object.assign({photo:null,tasks:{},team:[],claimed:[],history:[]},S[k]||{});
    if(!S[k].photo&&KID_PHOTOS[k])S[k].photo=KID_PHOTOS[k];
  });
}

function save(){localStorage.setItem('morningChamps',JSON.stringify(S))}

function todayStr(){return new Date().toLocaleDateString('en-CA')}
function dow(){return new Date().getDay()}
function isSchoolDay(){const d=dow();return d>=0&&d<=4}

function checkResets(){
  const today=todayStr();
  if(S.lastDate!==today){
    ['yehonatan','yoav'].forEach(k=>{S[k].tasks={};S[k].claimed=[]});
    if(dow()===6){
      ['yehonatan','yoav'].forEach(k=>{
        if(S[k].team.length>0){
          S[k].history.unshift({team:[...S[k].team],date:S.weekStart||today});
          if(S[k].history.length>8)S[k].history.pop();
        }
        S[k].team=[];
      });
      S.weekStart=today;
    }
    if(!S.weekStart)S.weekStart=today;
    S.lastDate=today;
    save();
  }
}

function getTasks(kid){
  const tasks=[...COMMON_TASKS];
  (SPECIAL_TASKS[kid]||[]).forEach(t=>{
    if(t.days.includes(dow()))tasks.push({...t,special:true});
  });
  return tasks;
}

function doneCount(kid){return getTasks(kid).filter(t=>S[kid].tasks[t.id]).length}

function getMilestones(kid){
  const draft=DAILY_DRAFT[dow()];
  if(!draft)return[];
  const total=getTasks(kid).length;
  return draft.map((slot,i)=>({...slot,threshold:Math.ceil(total*(i+1)/draft.length),index:i}));
}

function getNextMilestone(kid){
  const ms=getMilestones(kid);
  const done=doneCount(kid);
  return ms.find(m=>done>=m.threshold&&!S[kid].claimed.includes(m.index));
}

function getPlayerById(id){return PLAYERS.find(p=>p.id===id)}

function getDraftOptions(kid,generalPos){
  const taken=new Set(S[kid].team.map(t=>t.playerId));
  const eligible=PLAYERS.filter(p=>p.pos===generalPos&&!taken.has(p.id));
  const shuffled=eligible.sort(()=>Math.random()-.5);
  return shuffled.slice(0,3);
}

function autoFillTeam(kid){
  const team=S[kid].team;
  const filled=new Set(team.map(t=>t.pos));
  Object.keys(FORMATION_POS).forEach(pos=>{
    if(filled.has(pos))return;
    const gp=POS_MAP[pos];
    const taken=new Set(team.map(t=>t.playerId));
    const eligible=PLAYERS.filter(p=>p.pos===gp&&!taken.has(p.id));
    if(eligible.length){
      const pick=eligible[Math.floor(Math.random()*eligible.length)];
      team.push({playerId:pick.id,pos,day:-1});
    }
  });
}

function render(){
  const app=document.getElementById('app');
  if(S.view==='match'){app.innerHTML=renderMatchView();bindEvents();return}
  app.innerHTML=renderHeader()+`<div class="main-scroll" id="main">${
    S.view==='tasks'?renderTasksView():renderTeamView()
  }</div>`+renderNav();
  bindEvents();
}

function renderHeader(){
  const kids=Object.keys(KIDS);
  // Active kid in the center
  const sorted=[...kids].sort((a,b)=>a===S.currentKid?-1:b===S.currentKid?1:0);
  return `<div class="header">
    ${sorted.map(k=>renderKidBtn(k)).join('')}
  </div>`;
}

function renderKidBtn(kid){
  const info=KIDS[kid];
  const active=S.currentKid===kid?'active':'';
  const photo=S[kid].photo;
  return `<div class="kid-btn ${active}" data-switch="${kid}">
    <div class="kid-avatar-wrap">
      <div class="kid-avatar" style="${!photo?'background:'+info.color:''}">
        ${photo?`<img src="${photo}" alt="${info.name}">`:`<span>${info.initials}</span>`}
      </div>
      <div class="photo-badge">📷</div>
    </div>
    <div class="kid-label">${info.name}</div>
  </div>`;
}

function renderKidColumn(kid){
  const info=KIDS[kid];
  const tasks=getTasks(kid);
  const done=doneCount(kid);
  const total=tasks.length;
  const allDone=done===total;
  const pct=total?Math.round(done/total*100):0;

  let html=`<div class="kid-column">
    <div class="col-header">
      <div class="col-name">${info.name} <span style="color:var(--text3);font-weight:400">(${done})</span></div>
    </div>
    <div class="col-progress">
      <div class="col-progress-fill" style="width:${pct}%"></div>
      <div class="col-progress-text">${done} / ${total}</div>
    </div>`;

  if(allDone&&isSchoolDay()){
    html+=`<div class="col-done-trophy">\u{1F3C6}</div>`;
  }

  html+=tasks.map(t=>{
    const isDone=S[kid].tasks[t.id];
    return `<div class="col-task ${isDone?'done':''} ${t.special?'special':''}" data-kid="${kid}" data-col-task="${t.id}">
      <div class="col-task-icon">${t.icon}</div>
      <div class="col-task-name">${t.name}</div>
      <div class="col-task-check">${isDone?'✓':''}</div>
    </div>`;
  }).join('');

  html+=`</div>`;
  return html;
}

function renderTasksView(){
  const kid=S.currentKid;
  const info=KIDS[kid];
  const tasks=getTasks(kid);
  const done=doneCount(kid);
  const total=tasks.length;
  const allDone=done===total;
  const ms=getMilestones(kid);
  const pct=total?Math.round(done/total*100):0;

  // Tablet: dual columns
  let html=`<div class="dual-tasks">`;
  html+=`<div class="dual-day-label">יום ${DAY_NAMES[dow()]}</div>`;
  Object.keys(KIDS).forEach(k=>{html+=renderKidColumn(k)});
  html+=`</div>`;

  // Mobile: single kid view
  html+=`<div class="single-tasks">`;
  html+=`<div class="day-label" style="padding-top:10px">יום ${DAY_NAMES[dow()]}</div>`;

  html+=`<div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" style="width:${pct}%"></div>
      <div class="progress-text">${done} / ${total}</div>
    </div>
    ${ms.length?`<div class="milestones">${ms.map(m=>{
      const reached=done>=m.threshold;
      const next=!reached&&ms.filter(mm=>done>=mm.threshold).length===ms.indexOf(m);
      return `<span class="milestone ${reached?'reached':''} ${next?'next':''}">⚽</span>`;
    }).join('')}</div>`:''}
  </div>`;

  if(allDone&&isSchoolDay()){
    html+=`<div class="all-done-banner">
      <div class="banner-emoji" style="font-size:64px">\u{1F3C6}</div>
    </div>`;
  }

  html+=`<div class="task-list">${tasks.map(t=>{
    const isDone=S[kid].tasks[t.id];
    return `<div class="task-item ${isDone?'done':''} ${t.special?'special':''}" data-task="${t.id}">
      ${t.special?'<div class="task-special-badge">היום!</div>':''}
      <div class="task-icon">${t.icon}</div>
      <div class="task-name">${t.name}</div>
      <div class="task-check">${isDone?'✓':''}</div>
    </div>`;
  }).join('')}</div>`;

  const team=S[kid].team;
  if(team.length>0){
    html+=`<div class="team-preview">
      <div class="team-preview-title">⚽ הנבחרת שלי (${team.length}/11)</div>
    </div>`;
  }

  html+=`</div>`; // close single-tasks
  return html;
}

function renderTeamView(){
  const kid=S.currentKid;
  const info=KIDS[kid];
  const team=S[kid].team;
  const isFri=dow()===5||dow()===6;
  const isComplete=team.length>=11;

  if(isFri&&team.length>0&&team.length<11){
    autoFillTeam(kid);
    save();
  }

  const hl=S._highlightPos||null;
  S._highlightPos=null;
  let html=`<div class="team-header">⚽ הנבחרת של ${info.name}</div>`;
  html+=`<div class="team-count">${team.length}/11 שחקנים</div>`;
  html+=renderPitch(kid,hl);

  if(isComplete||isFri&&team.length>=11){
    html+=`<button class="match-btn" id="start-match">⚽ שחק משחק ידידות!</button>`;
  }

  if(S[kid].history.length>0){
    html+=`<div class="history-section"><div class="history-title">\u{1F3C6} נבחרות קודמות</div>`;
    S[kid].history.forEach((h,i)=>{
      const players=h.team.map(t=>getPlayerById(t.playerId)).filter(Boolean);
      const names=players.slice(0,3).map(p=>p.name).join(', ');
      html+=`<div class="history-item" data-history="${i}">
        <span>${names}${players.length>3?' ...':''}</span>
        <span style="font-size:11px;color:var(--text3)">${h.date||''}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  if(!isSchoolDay()&&team.length===0){
    html+=`<div class="empty-msg">\u{1F31F} ביום ראשון מתחילים לבנות נבחרת חדשה!</div>`;
  }

  return html;
}

function renderPitch(kid,highlightPos){
  const team=S[kid].team;
  const byPos={};
  team.forEach(t=>{byPos[t.pos]=getPlayerById(t.playerId)});

  let slots='';
  Object.entries(FORMATION_POS).forEach(([pos,coord])=>{
    const p=byPos[pos];
    if(p){
      const ph=PLAYER_PHOTOS[p.id];
      const hl=pos===highlightPos?' just-drafted':'';
      slots+=`<div class="slot pop${hl}" style="left:${coord.l}%;top:${coord.t}%">
        <div class="slot-filled">
          ${ph?`<img class="slot-photo" src="${ph}" alt="${p.name}" style="border-color:${rarityColor(p.rarity)}">`:`<div class="slot-photo-placeholder" style="border-color:${rarityColor(p.rarity)}">${p.num}</div>`}
          <div class="slot-name">${p.name}</div>
        </div>
        <div class="slot-label">${POS_LABELS[pos]}</div>
      </div>`;
    }else{
      slots+=`<div class="slot" style="left:${coord.l}%;top:${coord.t}%">
        <div class="slot-empty"><span style="font-size:14px;color:rgba(255,255,255,.3)">?</span></div>
        <div class="slot-label">${POS_LABELS[pos]}</div>
      </div>`;
    }
  });

  return `<div style="padding:0 14px"><div class="pitch">
    <div class="pitch-lines">
      <div class="pitch-center-dot"></div>
      <div class="pitch-box-top"></div>
      <div class="pitch-box-bottom"></div>
      <div class="pitch-goal-top"></div>
      <div class="pitch-goal-bottom"></div>
    </div>
    ${slots}
  </div></div>`;
}

function rarityColor(r){return['#66BB6A','#42A5F5','#CE93D8','#FFB300'][r]||'#fff'}

function renderNav(){
  return `<div class="bottom-nav">
    <div class="nav-tab ${S.view==='team'?'active':''}" data-view="team">
      <span class="nav-tab-icon">⚽</span>הנבחרת
    </div>
    <div class="nav-tab ${S.view==='tasks'?'active':''}" data-view="tasks">
      <span class="nav-tab-icon">\u{1F4CB}</span>משימות
    </div>
  </div>`;
}

function showDraft(milestone){
  const kid=S.currentKid;
  const gp=POS_MAP[milestone.pos];
  const options=getDraftOptions(kid,gp);
  if(options.length===0)return;

  const overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.id='draft-overlay';

  let cardsHtml=options.map((p,i)=>`
    <div class="draft-card" data-pick="${p.id}" data-pos="${milestone.pos}" data-idx="${milestone.index}">
      <div class="draft-card-inner">
        <div class="draft-card-face card-back card-back-${i}">
          <span>⚽</span>
        </div>
        <div class="draft-card-face card-front">
          ${renderPlayerCard(p)}
        </div>
      </div>
    </div>
  `).join('');

  overlay.innerHTML=`
    <div class="draft-title">\u{1F389} בחר ${milestone.label}!</div>
    <div class="draft-subtitle">לחץ על קלף</div>
    <div class="draft-cards">${cardsHtml}</div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelectorAll('.draft-card').forEach(card=>{
    card.addEventListener('click',function(){
      if(this.classList.contains('flipped'))return;
      const pid=this.dataset.pick;
      const pos=this.dataset.pos;
      const idx=parseInt(this.dataset.idx);

      this.classList.add('flipped');
      overlay.querySelectorAll('.draft-card').forEach(c=>{
        if(c!==this)c.classList.add('not-picked');
      });

      S[kid].team.push({playerId:pid,pos,day:dow()});
      S[kid].claimed.push(idx);
      save();

      const player=getPlayerById(pid);
      setTimeout(()=>{
        showConfetti(player.rarity>=2);
      },700);

      setTimeout(()=>{
        overlay.remove();
        S._highlightPos=pos;
        S.view='team';
        render();
        document.querySelectorAll('.slot.just-drafted').forEach(el=>el.scrollIntoView({behavior:'smooth',block:'center'}));
        const next=getNextMilestone(kid);
        if(next){
          setTimeout(()=>{S.view='tasks';render();setTimeout(()=>showDraft(next),400)},2000);
        }else{
          setTimeout(()=>{S.view='tasks';render()},3000);
        }
      },2800);
    });
  });
}

function renderPlayerCard(p){
  const photo=PLAYER_PHOTOS[p.id];
  return `<div class="player-card rarity-${p.rarity}">
    <div class="pc-top">
      <div><div class="pc-rating">${p.rating}</div><div class="pc-pos">${posLabel(p.pos)}</div></div>
      <div><span style="font-size:14px">${p.country}</span> <span class="pc-stars">${RARITY_STARS[p.rarity]}</span></div>
    </div>
    ${photo?`<img class="pc-photo" src="${photo}" alt="${p.name}">`:`<div class="pc-photo-placeholder">${p.num}</div>`}
    <div class="pc-name">${p.name}</div>
    <div class="pc-team"><span class="pc-team-dot" style="background:${p.clr}"></span>${p.team}</div>
  </div>`;
}

function posLabel(pos){return{GK:'שוער',DEF:'מגן',MID:'קשר',FWD:'חלוץ'}[pos]||pos}

function renderMatchView(){
  return `<div class="match-view">
    <div class="match-scoreboard">
      <div class="match-teams">
        <div class="match-team-name">הנבחרת של ${KIDS[S.currentKid].name}</div>
        <div class="match-score"><span id="score-home">0</span> - <span id="score-away">0</span></div>
        <div class="match-team-name">⭐ נבחרת הכוכבים</div>
      </div>
      <div class="match-minute" id="match-min"></div>
    </div>
    <div class="match-events" id="match-events"></div>
    <button class="match-back" id="match-back">← חזרה</button>
  </div>`;
}

function generateMatch(kid){
  const team=S[kid].team;
  const players=team.map(t=>({...getPlayerById(t.playerId),fPos:t.pos})).filter(Boolean);
  const gk=players.find(p=>p.pos==='GK');
  const fwds=players.filter(p=>p.pos==='FWD');
  const mids=players.filter(p=>p.pos==='MID');
  const defs=players.filter(p=>p.pos==='DEF');
  const pick=arr=>arr.length?arr[Math.floor(Math.random()*arr.length)]:players[0];

  const homeGoals=2+Math.floor(Math.random()*2);
  const awayGoals=homeGoals-1;
  let h=0,a=0;
  const events=[];

  const goalMins=[];
  const pool=[15,23,34,42,56,67,78,85];
  const shuffled=pool.sort(()=>Math.random()-.5);
  const homeGoalMins=shuffled.slice(0,homeGoals).sort((a,b)=>a-b);
  const awayGoalMins=shuffled.slice(homeGoals,homeGoals+awayGoals).sort((a,b)=>a-b);
  const allGoals=[...homeGoalMins.map(m=>({m,side:'home'})),...awayGoalMins.map(m=>({m,side:'away'}))].sort((a,b)=>a.m-b.m);

  const templates={
    attack:[
      (p1,p2)=>`${p1.name} שולט בכדור, מעביר ל${p2.name}...`,
      (p1,p2)=>`${p1.name} פורץ קדימה! מסירה ל${p2.name}!`,
      (p1)=>`${p1.name} עם ריצה מטורפת בצד!`,
    ],
    save:[
      ()=>`${gk?gk.name:'השוער'} עם הצלה אדירה! \u{1F9E4}`,
      ()=>`${gk?gk.name:'השוער'} קופץ וחוטף את הכדור!`,
    ],
    miss:[
      (p1)=>`${p1.name} יורה... מעל המשקוף! \u{1F62E}`,
      (p1)=>`${p1.name} בועט... הכדור עובר ליד העמוד!`,
    ],
    homeGoal:[
      (p1)=>`${p1.name} יורה ו... גוווווול!!! ⚽\u{1F525}`,
      (p1)=>`${p1.name} מבקיע! איזה גול מטורף! ⚽`,
    ],
    awayGoal:[
      ()=>'נבחרת הכוכבים מצמצמת! ⚽',
      ()=>'גול לנבחרת הכוכבים! \u{1F605}',
    ],
    defense:[
      (p1)=>`${p1.name} עם חיתוך מושלם! \u{1F4AA}`,
    ]
  };

  const tp=(arr,...args)=>arr[Math.floor(Math.random()*arr.length)](...args);

  let minute=1;
  const addEvent=(min,text,type='normal')=>events.push({min,text,type,h,a});

  addEvent(1,'\u{1F3C1} שריקת פתיחה! המשחק התחיל!','start');

  let goalIdx=0;
  for(let m=5;m<=90;m+=Math.floor(Math.random()*8)+5){
    if(goalIdx<allGoals.length&&m>=allGoals[goalIdx].m){
      const g=allGoals[goalIdx];
      if(g.side==='home'){
        const scorer=fwds.length?pick(fwds):pick(mids.length?mids:players);
        const assist=pick(mids.length?mids:fwds);
        addEvent(g.m,tp(templates.attack,assist,scorer));
        h++;
        events.push({min:g.m,text:tp(templates.homeGoal,scorer),type:'goal',h,a});
      }else{
        const def=pick(defs.length?defs:players);
        addEvent(g.m,`נבחרת הכוכבים מתקרבת למגן של ${def.name}...`);
        a++;
        events.push({min:g.m,text:tp(templates.awayGoal),type:'goal',h,a});
      }
      goalIdx++;
      continue;
    }

    const r=Math.random();
    if(r<.25){
      addEvent(m,tp(templates.attack,pick(mids.length?mids:players),pick(fwds.length?fwds:players)));
    }else if(r<.4){
      addEvent(m,tp(templates.miss,pick(fwds.length?fwds:mids.length?mids:players)));
    }else if(r<.55){
      addEvent(m,tp(templates.save));
    }else if(r<.7){
      addEvent(m,tp(templates.defense,pick(defs.length?defs:players)));
    }

    if(m>=42&&m<=48&&!events.find(e=>e.type==='halftime')){
      events.push({min:45,text:`⏱ מחצית! ${h}-${a}`,type:'halftime',h,a});
    }
  }

  events.push({min:90,text:`\u{1F3C6} שריקת סיום! הנבחרת של ${KIDS[kid].name} ניצחה ${h}-${a}! \u{1F389}`,type:'fulltime',h,a});
  return events;
}

let matchEvents=[],matchTimer=null;

function startMatch(){
  const kid=S.currentKid;
  if(S[kid].team.length<11){autoFillTeam(kid);save()}
  matchEvents=generateMatch(kid);
  S.view='match';
  render();
  playMatchEvents();
}

function playMatchEvents(){
  const container=document.getElementById('match-events');
  const minEl=document.getElementById('match-min');
  if(!container||!matchEvents.length)return;

  let idx=0;
  function next(){
    if(idx>=matchEvents.length)return;
    const ev=matchEvents[idx];
    const div=document.createElement('div');
    div.className='match-event'+(ev.type==='goal'?' goal':'')+(ev.type==='halftime'?' halftime':'')+(ev.type==='fulltime'?' fulltime':'');
    div.innerHTML=`<span class="event-min">${ev.min}'</span> ${ev.text}`;
    container.appendChild(div);
    container.scrollTop=container.scrollHeight;

    if(minEl)minEl.textContent=`⏱ דקה ${ev.min}'`;

    if(ev.type==='goal'||ev.type==='fulltime'){
      document.getElementById('score-home').textContent=ev.h;
      document.getElementById('score-away').textContent=ev.a;
      if(ev.type==='goal')showConfetti(false);
      if(ev.type==='fulltime')showConfetti(true);
    }

    idx++;
    if(idx<matchEvents.length){
      const delay=ev.type==='halftime'?2500:ev.type==='goal'?2000:1200+Math.random()*800;
      matchTimer=setTimeout(next,delay);
    }
  }
  next();
}

function stopMatch(){
  if(matchTimer)clearTimeout(matchTimer);
  matchEvents=[];
  S.view='team';
  render();
}

function bindEvents(){
  document.querySelectorAll('[data-switch]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const kid=el.dataset.switch;
      if(S.currentKid===kid){
        photoInputTarget=kid;
        document.getElementById('photo-input').click();
      }else{
        S.currentKid=kid;
        save();
        render();
      }
    });
  });

  document.querySelectorAll('[data-task]').forEach(el=>{
    el.addEventListener('click',()=>{
      const tid=el.dataset.task;
      const kid=S.currentKid;
      if(S[kid].tasks[tid])return;
      S[kid].tasks[tid]=true;
      save();

      el.classList.add('done');
      el.querySelector('.task-check').textContent='✓';
      showConfetti(false);

      const tasks=getTasks(kid);
      const done=doneCount(kid);
      const total=tasks.length;

      const progFill=document.querySelector('.progress-fill');
      const progText=document.querySelector('.progress-text');
      if(progFill)progFill.style.width=Math.round(done/total*100)+'%';
      if(progText)progText.textContent=`${done} / ${total}`;

      document.querySelectorAll('.milestone').forEach((m,i)=>{
        const ms=getMilestones(kid);
        if(ms[i]&&done>=ms[i].threshold)m.classList.add('reached');
      });

      setTimeout(()=>{
        const milestone=getNextMilestone(kid);
        if(milestone){
          showDraft(milestone);
        }else if(done===total){
          render();
        }
      },500);
    });
  });

  // Tablet dual-column task clicks
  document.querySelectorAll('[data-col-task]').forEach(el=>{
    el.addEventListener('click',()=>{
      const kid=el.dataset.kid;
      const tid=el.dataset.colTask;
      if(S[kid].tasks[tid])return;
      S[kid].tasks[tid]=true;
      S.currentKid=kid;
      save();
      showConfetti(false);

      setTimeout(()=>{
        const milestone=getNextMilestone(kid);
        if(milestone){
          showDraft(milestone);
        }else if(doneCount(kid)===getTasks(kid).length){
          render();
        }else{
          render();
        }
      },500);
    });
  });

  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{
      S.view=el.dataset.view;
      save();
      render();
    });
  });

  const matchBtn=document.getElementById('start-match');
  if(matchBtn)matchBtn.addEventListener('click',startMatch);

  const matchBack=document.getElementById('match-back');
  if(matchBack)matchBack.addEventListener('click',stopMatch);
}

document.getElementById('photo-input').addEventListener('change',async function(){
  if(!this.files[0]||!photoInputTarget)return;
  const file=this.files[0];
  const reader=new FileReader();
  reader.onload=async function(e){
    try{
      const dataUri=await resizeImage(e.target.result,200);
      S[photoInputTarget].photo=dataUri;
      save();
      render();
    }catch(err){alert('לא הצלחנו לטעון את התמונה, נסו שוב')}
  };
  reader.readAsDataURL(file);
  this.value='';
});

function resizeImage(dataUri,maxSize){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onerror=()=>reject(new Error('Invalid image'));
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>h){h=h*maxSize/w;w=maxSize}else{w=w*maxSize/h;h=maxSize}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',.8));
    };
    img.src=dataUri;
  });
}

const confettiCanvas=document.getElementById('confetti-canvas');
const confettiCtx=confettiCanvas.getContext('2d');
let confettiParticles=[],confettiRunning=false;

function showConfetti(big){
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
  const colors=['#FF6B6B','#4ECDC4','#45B7D1','#FFA07A','#98D8C8','#FFD700','#FF69B4','#7C4DFF','#00E676'];
  const count=big?150:80;
  const spread=big?window.innerWidth:window.innerWidth*.8;
  const startX=window.innerWidth/2;

  for(let i=0;i<count;i++){
    confettiParticles.push({
      x:startX+(Math.random()-.5)*spread*.3,
      y:big?-20:window.innerHeight*.3,
      vx:(Math.random()-.5)*(big?14:8),
      vy:-(Math.random()*(big?14:8)+3),
      size:Math.random()*8+4,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,
      rotV:(Math.random()-.5)*12,
      life:1
    });
  }
  if(!confettiRunning){confettiRunning=true;animateConfetti()}
}

function animateConfetti(){
  confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  confettiParticles=confettiParticles.filter(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=.25;
    p.vx*=.99;
    p.rot+=p.rotV;
    p.life-=.008;
    if(p.life<=0||p.y>confettiCanvas.height+20)return false;
    confettiCtx.save();
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rot*Math.PI/180);
    confettiCtx.globalAlpha=p.life;
    confettiCtx.fillStyle=p.color;
    confettiCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
    confettiCtx.restore();
    return true;
  });
  if(confettiParticles.length)requestAnimationFrame(animateConfetti);
  else{confettiRunning=false;confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height)}
}

load();
checkResets();
render();

window.addEventListener('resize',()=>{
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
});
</script>
